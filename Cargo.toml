[package]
name = "crypto_rs"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
age = "0.11.1"
anyhow = "1.0.100"
dirs = "6.0.0"
owo-colors = "4.2.3"
rand = "0.9.2"
clap = { version = "4.5.51", features = ["derive"] }
camino = "1.2.1"
comfy-table = "7.2.1"
blake3 = "1.8.2"


# optimize for size
[profile.release]
strip = true
lto = true
opt-level = "z"
debug = 0
overflow-checks = false
panic = "abort"
codegen-units = 1
